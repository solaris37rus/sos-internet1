<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Диагностика — SOS Интернет</title><link rel="stylesheet" href="/styles.css"/></head><body><main class="diag"><a class="brand" href="/"><span class="mark">SOS</span><span>Интернет</span></a><h1>Диагностика</h1><div class="diag-card"><h3>1. API health</h3><button class="btn primary" id="check">Проверить</button><pre class="code" id="out">Нажми “Проверить”.</pre></div><div class="diag-card"><h3>2. Webhook Telegram</h3><p class="fine">После добавления TELEGRAM_BOT_TOKEN и TELEGRAM_BOT_USERNAME нажми кнопку.</p><button class="btn ghost" id="webhook">Подключить webhook</button><pre class="code" id="wh">—</pre></div></main><script>const out=document.getElementById('out'),wh=document.getElementById('wh');document.getElementById('check').onclick=async()=>{out.textContent='Загрузка...';out.textContent=JSON.stringify(await (await fetch('/api/health')).json(),null,2)};document.getElementById('webhook').onclick=async()=>{wh.textContent='Загрузка...';wh.textContent=JSON.stringify(await (await fetch('/api/telegram/set-webhook?token=sos_admin_2026_super_secret')).json(),null,2)}</script></body></html>
