<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b14" />
  <title>Админка — SOS Интернет</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="admin-body">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <main class="admin-shell">
    <header class="admin-hero glass-panel">
      <div class="admin-hero__left">
        <a class="brand" href="/"><span class="brand-mark">SOS</span><span class="brand-text">Интернет</span></a>
        <div class="badge"><span></span> Premium Admin</div>
        <h1>Панель заказов</h1>
        <p class="admin-note">Управляйте заявками, статусами и оплатами в одном месте. Если секрет ADMIN_TOKEN не задан в Cloudflare, работает резервный токен по умолчанию.</p>
      </div>
      <div class="admin-stats">
        <div class="mini-stat"><span>Всего заказов</span><strong id="statCount">0</strong></div>
        <div class="mini-stat"><span>Сумма заказов</span><strong id="statRevenue">0 ₽</strong></div>
        <div class="mini-stat"><span>Оплачено / выдано</span><strong id="statPaid">0</strong></div>
      </div>
    </header>

    <section class="admin-panel premium-panel">
      <div class="admin-toolbar">
        <div class="field-group grow">
          <label for="token">ADMIN_TOKEN</label>
          <input class="token" id="token" placeholder="ADMIN_TOKEN" />
        </div>
        <div class="field-group compact">
          <label for="filterStatus">Фильтр</label>
          <select id="filterStatus">
            <option value="">Все статусы</option>
            <option value="awaiting_payment">awaiting_payment</option>
            <option value="paid">paid</option>
            <option value="delivered">delivered</option>
            <option value="cancelled">cancelled</option>
          </select>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-primary" id="saveToken">Сохранить токен</button>
          <button class="btn btn-secondary" id="loadOrders">Загрузить заказы</button>
        </div>
      </div>

      <div id="adminStatus" class="form-status"></div>

      <div class="table-wrap">
        <table id="ordersTable" class="premium-table"></table>
      </div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
