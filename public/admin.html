<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка — SOS Интернет</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{padding:40px 5vw}.admin-wrap{max-width:1100px;margin:auto}.admin-panel{padding:24px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.06)}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--accent)}.admin-controls{display:flex;gap:12px;flex-wrap:wrap}select.small{width:auto}.token{max-width:440px}.status-pill{padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.08);display:inline-block}.admin-note{color:var(--muted);line-height:1.55}</style>
</head>
<body>
  <main class="admin-wrap">
    <a class="brand" href="/"><span class="brand-mark">SOS</span><span class="brand-text">Интернет</span></a>
    <h1>Админка заказов</h1>
    <p class="admin-note">Введите ADMIN_TOKEN из Cloudflare Pages → Settings → Environment variables. Токен хранится только в localStorage вашего браузера.</p>
    <section class="admin-panel">
      <div class="admin-controls">
        <input class="token" id="token" placeholder="ADMIN_TOKEN" />
        <button class="btn btn-primary" id="saveToken">Сохранить токен</button>
        <button class="btn btn-secondary" id="loadOrders">Загрузить заказы</button>
      </div>
      <div id="adminStatus" class="form-status"></div>
      <div style="overflow:auto"><table id="ordersTable"></table></div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
